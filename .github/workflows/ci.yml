name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve libsodium pinned SHA
        id: libsodium-sha
        run: echo "sha=$(git ls-tree HEAD c/vendor/github.com/jedisct1/libsodium | awk '{print $3}')" >> $GITHUB_OUTPUT
      - name: Cache vendored libsodium build
        id: cache-libsodium
        uses: actions/cache@v4
        with:
          path: c/vendor/build
          key: libsodium-${{ runner.os }}-${{ steps.libsodium-sha.outputs.sha }}-${{ hashFiles('c/vendor/build.sh') }}
      - name: Init vendored libsodium submodule
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 c/vendor/github.com/jedisct1/libsodium
      - name: Build vendored libsodium
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: bash c/vendor/build.sh libsodium
      - name: Increase UDP buffer size for QUIC
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032
      - run: go test ./...

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve libsodium pinned SHA
        id: libsodium-sha
        run: echo "sha=$(git ls-tree HEAD c/vendor/github.com/jedisct1/libsodium | awk '{print $3}')" >> $GITHUB_OUTPUT
      - name: Cache vendored libsodium build
        id: cache-libsodium
        uses: actions/cache@v4
        with:
          path: c/vendor/build
          key: libsodium-${{ runner.os }}-${{ steps.libsodium-sha.outputs.sha }}-${{ hashFiles('c/vendor/build.sh') }}
      - name: Init vendored libsodium submodule
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 c/vendor/github.com/jedisct1/libsodium
      - name: Build vendored libsodium
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: bash c/vendor/build.sh libsodium
      - name: Increase UDP buffer size for QUIC
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install npm dependencies
        run: npm ci
        working-directory: web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run browser WebTransport E2E tests
        run: npm run test:e2e
        working-directory: web

  amalgamate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate and amalgamate
        run: make amalgamate
      - name: Check for stale dist files
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ is out of date. Run 'make amalgamate' and commit the result."
            git diff dist/
            exit 1
          fi

  swift-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve libsodium pinned SHA
        id: libsodium-sha
        run: echo "sha=$(git ls-tree HEAD c/vendor/github.com/jedisct1/libsodium | awk '{print $3}')" >> $GITHUB_OUTPUT
      - name: Cache vendored libsodium build
        id: cache-libsodium
        uses: actions/cache@v4
        with:
          path: c/vendor/build
          key: libsodium-${{ runner.os }}-${{ steps.libsodium-sha.outputs.sha }}-${{ hashFiles('c/vendor/build.sh') }}
      - name: Init vendored libsodium submodule
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 c/vendor/github.com/jedisct1/libsodium
      - name: Build vendored libsodium
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: bash c/vendor/build.sh libsodium
      - run: swift test

  deploy:
    name: Deploy to Fly.io
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
