#
# Release workflow — triggered when a GitHub release is published.
# Builds the pigeon relay binary for three platforms and uploads tarballs
# to the existing release. Also triggers homebrew-releaser to update the
# marcelocantos/homebrew-tap formula.
#
# NOTE: This workflow never creates tags or releases — those are created
# locally via `gh release create`. This workflow only builds artifacts.

name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # cwire links the vendored libsodium static lib at the hardcoded path
      # c/vendor/build/lib/libsodium.a (see cwire/cwire.go #cgo LDFLAGS), so
      # the release build needs CGO on and that lib built natively for the
      # target. Mirror ci.yml's submodule + cache pattern, keyed per os/arch.
      - name: Resolve libsodium pinned SHA
        id: libsodium-sha
        run: echo "sha=$(git ls-tree HEAD c/vendor/github.com/jedisct1/libsodium | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache vendored libsodium build
        id: cache-libsodium
        uses: actions/cache@v5
        with:
          path: c/vendor/build
          key: libsodium-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.libsodium-sha.outputs.sha }}-${{ hashFiles('c/vendor/build.sh') }}

      - name: Init vendored libsodium submodule
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 c/vendor/github.com/jedisct1/libsodium

      - name: Build vendored libsodium
        if: steps.cache-libsodium.outputs.cache-hit != 'true'
        run: bash c/vendor/build.sh libsodium

      - name: Run tests
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go test ./...

      - name: Build binary
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o pigeon ./cmd/pigeon

      - name: Package tarball
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          TARBALL="pigeon-${VERSION#v}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar czf "${TARBALL}" pigeon
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${VERSION}" "${TARBALL}"

  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: marcelocantos
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula_folder: Formula
          version: ${{ github.event.release.tag_name }}
          install: 'bin.install "pigeon" => "pigeon"'
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
          test: 'system bin/"pigeon", "--version"'
          skip_checksum: true
          update_readme_table: true
