SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  acceptor_identity_pub = "acceptor_id"
  acceptor_instance_id = "acceptor_instance"
  initiator_identity_pub = "initiator_id"
  initiator_instance_id = "initiator_instance"
  adversary_keys = {}
  adv_eph_pub = "adv_eph"
  adv_commit = "adv_commit"
  adv_saved_acceptor_eph = "none"
  adv_saved_initiator_eph = "none"
  adv_saved_initiator_commit = "none"

INVARIANTS
  MitMDetectedByCodeMismatch
  MitMPreventsPairing
  HonestPairingMatchesCodes
  PairingProducesValidRecord
  CodeRequiresCommit
  RevealBoundByCommit

\* Liveness (HonestPairingCompletes) is omitted from the standard run:
\* TLC explores all event interleavings, including user_cancel paths,
\* so without weak fairness on user_confirm a stuttering trace exists
\* trivially. Add fairness annotations to the YAML if model-checking
\* the liveness property becomes important.
