  T45:
    name: 'Relay''s L1 collapses to the remote-Listen model: register / listen / accept / connect with per-client end-to-end QUIC pipes, replacing the register-mux greeting and the clientTag prefix scheme'
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 13.0
    acceptance:
    - 'The relay''s wire greeting set becomes one verb family: `register:<id>` (backend control), `listen:<id>` (backend opens a slot), `connect:<id>` (client requests a backend). The legacy `register-mux[:token[:id]]` greeting and the legacy bare `connect:<id>` 1:1 form (already removed under T39.6) are gone. New greetings are protogen-specified per docs/DESIGN.md §4.'
    - Per accepted client, the backend has its own end-to-end QUIC connection to the relay (each `listen` is a parked backend-side QUIC connection that becomes a client-bridge once matched). The 4-byte clientTag prefix on streams and datagrams is deleted across the codebase — the per-client demux moves out of the application layer because each client has its own QUIC pipe.
    - The `acceptPrimary` machinery (which exists today only because mux needed a way to bind a tag to a Session via a first message on the primary) is deleted. The activation handshake T39.1 landed runs on the per-client QUIC pipe directly, not on a tag-prefixed sub-stream.
    - All SDKs (Go, Swift, Kotlin, C, TS) update to the new greetings. wire_vectors_test.go and the cross-language byte-vector tests in audit-log.md §T27 either pass against the new wire or are explicitly retired.
    - Authentication of the backend identity (currently the bearer token on register-mux greeting, tracked separately under T42) is preserved on the new register greeting.
    - make bullseye stays green; the relay loses the demux dispatcher / instance.clients map / dispatchStreams / dispatchDatagrams machinery; net delete is substantial.
    context: |-
      Captures docs/DESIGN.md §3 L1's "Current state vs. target" gap: the modern API still uses the multi-tenant register-mux + per-client tag prefix scheme, even though the four-layer model says L1 should be a remote-Listen primitive that gives each accepted client its own end-to-end QUIC pipe. Discovered during the T39 design discussion (2026-05-06); deferred to its own epic because it's wire-protocol-breaking across all SDKs and substantially larger than the per-leaf T39.x work.

      Depends on: T39.6 (Conn deletion) so that there's only one bridging mode left to collapse from; T40 (one-shot byte-format protogen specs) so that the new greeting set can ride that infrastructure rather than hand-roll it again.

      Knock-on cleanups when this lands: the per-client demux tables, the clientTag concept, the entire §5 "Demux tables and queues" line about per-client tag mapping, and the asymmetric primary-stream concept all evaporate from the codebase.
    depends_on:
    - T39.6
    - T40
    origin: manual
