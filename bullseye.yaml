  T23:
    name: macOS backends can store the long-term Identity in the system Keychain (Tier 1, in-process X25519/Ed25519)
    status: identified
    value: 0.0
    cost: 0.0
    showcase: true
    acceptance:
    - A `crypto.Identity` implementation backed by the macOS Keychain exists (likely as `examples/echo/backend/keychain_identity_darwin.go` with `//go:build darwin && cgo`, or a small platform subpackage if shared between demos).
    - The implementation stores the X25519 + Ed25519 private bytes as a single Keychain generic-password item (kSecClassGenericPassword), with kSecAttrAccessible=kSecAttrAccessibleWhenUnlocked and kSecAttrSynchronizable=false.
    - First run generates the keypair and writes it to the Keychain; subsequent runs load and reuse it. Identity persists across daemon restarts and process re-launches.
    - The backend demo can be compiled and run on macOS using the Keychain identity instead of `crypto.NewFileIdentity`, with a one-line swap in main.go/pair.go.
    - InstanceID derived from the Keychain-loaded Identity matches the InstanceID a previously-paired client expects (i.e. the public-key-derived ID is stable).
    context: |-
      When a backend runs on macOS in production, `NewFileIdentity` (raw X25519 + Ed25519 in a 0600 file on disk) is too weak — the bytes sit decrypted at rest, and any process running as the user can read them. The macOS Keychain encrypts items at rest, gates access to the user's login session, and supports access-control lists.

      Tier 1 only — explicitly out of scope:
      - Secure Enclave (Tier 2): SEP supports only NIST P-256, not X25519 / Ed25519. True enclave protection requires a wire-protocol curve change and is deferred until pigeon's pairing protocol moves to P-256.
      - iOS Keychain: similar mechanics, separate target.
      - Linux Secret Service / Windows DPAPI: separate targets per platform.

      Implementation notes (from the design conversation):
      - Use `github.com/keybase/go-keychain` for the SecItem* wrapper. CGo is required.
      - Cache decoded keys in process memory after first Keychain read; don't re-fetch on every Sign/DeriveSharedSecret.
      - Code-signing matters: re-signing the binary changes Keychain partition; expect a one-time re-pair on dev → distribution transition.
      - Migration: detect a legacy file-backed identity and import it into Keychain on first Keychain-build run, then delete the file. Application-level concern, not pigeon's.

      Deferred until 🎯T22 lands the `crypto.Identity` interface and the example app actually uses it.
    depends_on:
    - T22
    origin: manual
    discovered: 2026-04-29
