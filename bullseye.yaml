    discovered: 2026-04-08
    achieved: 2026-04-25
  T1.2:
    name: Pigeon exposes pairing-artifact + credential-store + pairing-host primitives
    status: achieved
    value: 0.0
    cost: 0.0
    showcase: true
    acceptance:
    - A typed PairingArtifact (instance ID, relay URL, bearer token, key material, issued-at, expires-at) has canonical encode/decode in Go, Swift, and Kotlin, with round-trip tests
    - PairingArtifact has both a canonical JSON encoding and a canonical text (base64url) encoding, and the two are interconvertible across all three SDKs — so an artifact can be transported as a QR payload, a launch argument, an environment variable, or a file with no transcoding glue
    - 'A CredentialStore interface (Save/Load/Delete/IsExpired) is defined in pigeon, with reference implementations: file+OS-keyring on desktop, Keychain on iOS, EncryptedSharedPreferences on Android'
    - A PairingHost helper wraps Register() + the crypto handshake + artifact minting on the server side, with a configurable TTL (defaulting to 30 days) and tests covering happy path + expired-artifact rejection
    - A small CLI subcommand (e.g. `pigeon pair-mint`) issues an artifact for deploy-script use, taking a peer instance ID + relay URL + optional TTL and emitting the canonical JSON or text encoding
    - Connect() returns a typed ErrPairingExpired (or platform equivalent) when an artifact's expiry has passed, so clients can route to a re-pair flow uniformly
    - 'Inline package docs cover the lifecycle: pair -> persist -> connect -> expire -> re-pair (the standalone end-to-end guide is 🎯T1.3)'
    context: 'Lifted from analysis of Jevon''s needs (forked from the now-retired T1.1). Every pigeon client will need to (a) carry pairing state across processes/restarts, (b) persist it durably with platform-appropriate secrecy, and (c) handle expiry/re-pair. Building this once in pigeon turns each client integration from a ~500-line bespoke layer into wiring up a few typed primitives. The PairingArtifact schema is the most load-bearing piece: get it right and the rest follows. CredentialStore stays an interface so apps can swap in their own backing store; reference impls cover the common cases. PairingHost is the server-side counterpart that mints artifacts with TTLs. Revocation/paired-device-list is intentionally out of scope — defer until a second client asks. Observable in this repo: types compile, tests pass, docs render. Scoped narrowly so it can converge here without touching Jevon. Two delivery channels are first-class: (1) QR scan from a paired-screen UX, and (2) developer-deploy where a script mints the artifact on the laptop and injects it onto the device via xcrun (file copy to the app container, launch argument, or pasteboard) during/after install. The library stays delivery-agnostic — it ships JSON + text encodings and a mint CLI; the consuming app or deploy script wires the transport. Pigeon does NOT shell out to xcrun or know about device IDs.'
    origin: forked from T1.1 (retired 2026-04-25)
    discovered: 2026-04-25
    achieved: 2026-04-25
  T1.3:
    name: Pigeon documents the 30-day re-pair lifecycle end-to-end
    status: achieved
    value: 0.0
    cost: 0.0
    showcase: true
    acceptance:
    - 'docs/ contains a top-level guide walking through the full lifecycle: server mints artifact via PairingHost -> deliver -> client decodes -> CredentialStore persists -> Connect() succeeds -> 30 days later expiry triggers ErrPairingExpired -> re-pair flow'
    - 'The guide covers two pairing-delivery flows side by side using the same PairingArtifact primitive: (1) QR scan from a paired-screen UX, and (2) developer-deploy via xcrun (mint on laptop, inject into iOS app container or via launch argument during install)'
    - Each step shows code in Go, Swift, and Kotlin
    - Guide explains the TTL knob, where it lives, and how to choose a value (30-day default, with rationale)
    - Guide is linked from the repo README
    context: 'Tracked separately from T1.2 because the doc work is a distinct deliverable: the primitives can land first and be exercised internally; the public-facing lifecycle guide stitches them together for client authors. Keeps T1.2''s acceptance focused on the API surface rather than narrative documentation. Observable when the guide renders correctly and the README links to it.'
    depends_on:
    - T1.2
    origin: forked from T1.1 (retired 2026-04-25)
    discovered: 2026-04-25
    achieved: 2026-04-26
