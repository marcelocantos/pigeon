  T17:
    name: testCrossLanguageConfirmationCode passes on macos-14 CI runner
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 3.0
    acceptance:
    - swift test --filter testCrossLanguageConfirmationCode passes on macos-latest in GitHub Actions
    - The --skip testCrossLanguageConfirmationCode flag is removed from .github/workflows/ci.yml swift-test job
    - Test passes both locally on macos-26 and in CI on macos-14
    context: 'testCrossLanguageConfirmationCode in Tests/PigeonRelayE2ETests/RelayE2ETests.swift fails deterministically on the macos-14 GitHub Actions runner with `POSIXErrorCode(rawValue: 57): Socket is not connected` at RelayE2ETests.swift:363 (readExact). The test passes locally on macos-26 (Apple M4 Max). The failure pattern: the 4-byte length header arrives via NWConnection, but the body read fails mid-way. Other RelayE2ETests using NWConnection (testEncryptedRoundTrip, testRegister, testStreamRoundTrip, testTenMessagesInOrder) pass on the same runner — so it''s not generic NWConnection flakiness. The crucial difference is testCrossLanguageConfirmationCode spawns a separate `crypto-peer` Go subprocess that itself opens a relay connection, then the Swift test connects as a second client. Possibly related to v0.17 multi-client relay behaviour interacting with macos-14 NWConnection in a way that newer macOS handles. To unblock 🎯T16''s CI integration, the test is currently skipped with `swift test --skip testCrossLanguageConfirmationCode`. Removing the skip is this target''s exit criterion.'
    origin: forked-from 🎯T16 (swift-test CI integration)
    discovered: 2026-04-19
    achieved: 2026-04-19
  T18:
    name: Root Go test suite passes reliably under bulk load
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - '`go test -count=1 -short ./.` (root package only) passes across 10 consecutive runs with no context-deadline or `no recent network activity` failures'
    - The suite completes in under 300s wall-clock on M4 Max
    - '`go test ./...` can be restored as the bullseye standing-invariant check without flakiness'
    context: 'The root package integration tests create and tear down many QUIC sessions. When run in bulk, tests fail non-deterministically with `quic dial: timeout: no recent network activity` or `context deadline exceeded` errors — different tests fail on each run (observed: TestBlackholeRecovery, TestContextCancellation, TestRapidOpenAccept, TestLANUpgradeConcurrentSends, TestBackendOpensChannelViaWT, TestDropWindowMidConversation, TestStressStreamBurst). Each test passes reliably in isolation (sub-second). Strong signal of resource contention — likely QUIC goroutines/sockets from prior tests lingering into later tests, exceeding what the runtime can service concurrently. May also indicate production resource-leak paths worth auditing. Current mitigation: bullseye''s Go test step restricted to reliable subpackages (crypto, protocol, qr, faultproxy, cmd/pigeon).'
    origin: Discovered while adding bullseye Makefile target 2026-04-22
    discovered: 2026-04-22
