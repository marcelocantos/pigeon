  T21:
    name: protogen supports flat message-struct codegen for protocols that don't have state machines
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: |-
      Withdrawn 2026-04-26. Filed against a non-public surface — pigeon's
      cmd/protogen is internal infrastructure for generating pigeon's own
      protocol code (PairingCeremony, Session, PathSwitch state machines and
      their constants), not a public codegen tool for pigeon consumers. The
      abstraction pigeon offers third-party users is at the runtime layer
      (Conn, StreamChannel, DatagramChannel for streams and datagrams);
      applications speak their own wire protocols over those channels as
      opaque bytes. The originating motivation (ge's wire-protocol codegen
      need) is real but should be solved by ge's own codegen choice
      (protobuf / FlatBuffers / Cap'n Proto / bespoke), not by extending
      pigeon's internal generator. ge's 🎯T11.1 has been rewritten without
      the pigeon-protogen framing accordingly.
    acceptance:
    - A YAML protocol can declare typed message structs (with named fields, primitive types, nested types, arrays) without requiring an `actors:` block or any state-machine transitions. protogen emits typed Go structs, Swift structs, Kotlin data classes, C structs, and TypeScript interfaces for each — same field naming, same wire-format compatibility across SDKs.
    - The current state-machine-centric path is unaffected — protocols with `actors:` continue to generate the same machine code as today. The new flat-message path is additive; either or both can appear in a single YAML.
    - 'ge''s protocol/ge_wire.yaml (committed in ge PR #45) can be simplified: the three trivial `Idle → Idle` placeholder actors that exist solely to satisfy the validator can be removed; the `messages:` section gains real typed field declarations for DeviceInfo, SafeAreaUpdate, AspectLock, MessageHeader, etc.; ge''s Protocol.h struct declarations move into ge_wire.yaml and the generated bindings replace them entirely (closing ge''s 🎯T11.1.1 acceptance).'
    - STABILITY.md documents the new `messages:` schema (or whatever name fits) with field types, optionality, and naming conventions. Wire format for serialised structs is documented — either a fixed packed-binary layout (for parity with ge's hand-rolled MessageHeader convention) or a JSON-encoded form (for parity with PairingArtifact).
    context: |-
      Surfaced 2026-04-26 by ge's 🎯T11.1 implementation work (the wire-protocol-via-protogen PR at squz/ge#45). The migration succeeded for constants — ge's 11 message magic numbers and framing/sensor/orientation/device-class constants flowed from a single YAML through protogen's Go/Swift/Kotlin/C/TypeScript codegen — but stopped short of replacing ge's struct declarations (DeviceInfo, SafeAreaUpdate, AspectLock, MessageHeader) because pigeon's protocol parser doesn't model message-body field schemas. Those structs remained hand-declared in ge/include/ge/Protocol.h.

      The user clarified later the same day that pigeon's protogen is internal infrastructure, not a public codegen surface for consumers — the public abstraction is at the runtime layer (Conn / StreamChannel / DatagramChannel). The premise of this target was therefore wrong; ge's codegen problem is real but belongs to ge, not to pigeon. PR #45 has been closed and ge's 🎯T11.1 rewritten to leave the codegen-tool choice open (protobuf / FlatBuffers / Cap'n Proto / bespoke).
    tags:
    - protogen
    - schema
    - ge-feedback
    - codegen-coverage
    origin: manual
    discovered: 2026-04-26
  T22:
    name: examples/echo backend and client demos build and run end-to-end against the redesigned multi-channel pigeon API
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - The four files examples/echo/{backend,client}/{main,pair}.go build with no `//go:build ignore` tag and no diagnostic errors.
    - Running `./backend pair` followed by `./client pair --token <…>` on a fresh keystore produces matching PairingRecords (one entry per side) and matching 6-digit confirmation codes.
    - With at least one pairing in place, `./backend` accepts a `./client --peer <name>` connection over the relay, and a stdin → stdout echo loop works on the named `chat` stream.
    - On the same `*pigeon.Conn`, a second channel (e.g. `OpenDatagram(ctx, "voice-audio")` opened on both sides) round-trips messages independently of `chat`, demonstrating multi-channel multiplexing.
    - While `./backend` is running, invoking `./backend pair` in a separate process adds a new entry to pairings.json that the daemon picks up via fsnotify within a few seconds and accepts as a valid client without restart.
    - The relay (cmd/pigeon) forwards every QUIC stream and datagram opaquely between the two peers; the per-channel encryption is end-to-end with keys derived from each side's PairingRecord and Identity.
    - The pairing ceremony is implemented end-to-end (rendezvous token, ECDH, 6-digit code derivation, Confirm/Close lifecycle) in package pigeon/pairing; pigeon/crypto.NewFileIdentity is implemented (real X25519 + Ed25519 keypair persisted to a 0600 file).
    context: |-
      Pigeon's existing API holds for a single primary stream but leaks transport-mode and channel-cardinality details to callers as soon as a second consumer wants more. The jevons voice case (separate encrypted datagram lane for PCM audio alongside the chat stream) made this concrete and forced a redesign.

      Why we missed it (retrospective):
      - `Conn` was specced channel-first, not channel-as-instance — Send/Recv lived on the conn, so "second encrypted lane" doesn't fit the type.
      - `SetChannel` was bolted on; per-channel keys never happened because there was only one channel.
      - Relay bridging was scoped to the primary stream (see comment at conn.go:158); there was no second consumer to make the gap visible, so it lived as a TODO instead of a bug.
      - STABILITY.md sketched the eventual `OpenStream`/`OpenDatagram` shape but no caller forced it.
      - The "transport invisible" property was tested against the chat case, never against "callers don't see how many channels they get."

      The new shape (sketched in detail across this session and embedded in the example files at examples/echo/{backend,client}/{main,pair}.go, currently `//go:build ignore`):
      - pigeon.Register(ctx, *RegisterArgs) → (*Listener, instanceID, error); Listener.Accept yields per-client *Conn.
      - pigeon.Connect(ctx, *ConnectArgs) → *Conn for the client side.
      - Conn.OpenStream(ctx, name) and Conn.OpenDatagram(ctx, name) with rendezvous-on-name semantics; AcceptStream/AcceptDatagram for dynamic acceptors.
      - Stream/Datagram types with Send([]byte) / Recv(ctx) — no more io.ReadWriteCloser shape.
      - pigeon/pairing decoupled from connect: Register → Pairer → Accept → Ceremony with Token/Code(ctx)/Confirm(ctx)/Close().
      - Initiate is the one-shot initiator counterpart; both sides get a Ceremony.
      - crypto.Identity is an interface; NewFileIdentity ships as the dev/CLI default. PairingRecord remains the persisted artifact (existing struct, no raw private bytes long-term).
      - Args are concrete struct pointers (no `opts ...Option`); function-valued fields are singular; pairing storage is a map + callback (no Pairings interface, no SinglePairing helper).

      Scope guidance from the user: "Don't worry about breaking anything else. For now, all I want is the new API, and use the new API to implement the example app." Existing callers (cmd/pigeon, conn_test.go, chaos_test.go, lan_test.go, the Swift/Kotlin generated machines, the iOS bridge in cmd/pigeon-bridge, etc.) may stop building during this work; bringing them along is a follow-up, not a precondition for retiring this target.

      Stubs already landed: pairing/pairing.go (every function panics), crypto/identity.go (Identity interface + NewFileIdentity stub). The example files compile against those stubs once the pigeon-side reshape (RegisterArgs/ConnectArgs/Listener/Stream/Datagram) is in place.
    depends_on:
    - T22.2
    - T22.3
    - T22.4
    - T22.5
    - T22.6
    - T22.7
    origin: manual
    discovered: 2026-04-29
    achieved: 2026-04-30
