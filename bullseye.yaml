    context: |-
      Both the Swift and Kotlin wrappers hit the same wall: pigeon_stream_send / pigeon_stream_recv / pigeon_datagram_send / pigeon_datagram_recv stack-allocate `uint8_t ct[PIGEON_MAX_MSG + 32]` (~1 MiB). Swift's cooperative thread pool gives ~256 KiB and DispatchQueue workers ~64 KiB; JVM threads default to 512 KiB on macOS aarch64. Both sides had to introduce a workaround:

        - Swift: BigStackWorker — a dedicated serial Thread with stackSize=4 MiB hosting every C call (Sources/Pigeon/BigStackWorker.swift).
        - Kotlin: build.gradle.kts test task gets `-Xss4m` so JUnit threads don't SIGILL.

        Both workarounds disappear if the C library uses heap-allocated scratch (one buffer pair per session) instead of stack arrays. The fix is small and localised — replace the two `uint8_t ct[...]` declarations in pigeon_stream_send/recv and the analogous pair in pigeon_datagram_send/recv with pointers into pigeon_session.scratch_send / scratch_recv, lazily allocated at session_init time.

