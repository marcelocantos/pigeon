  T39.4:
    name: pigeon.Session adopts the SessionMachine executor for all transport ops; the per-Session executor replaces hand-rolled clientAcceptLoop / clientDatagramLoop / inline Send / Recv
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - pigeon.Session owns the per-instance SessionMachine produced by activation (T39.1's runBackendActivation / runClientActivation no longer discard the machine they build). The machine is advanced through SessionEstablished so the post-activation state on the Session is SessionProtocol{Backend,Client}RelayConnected.
    - Session.Close fires SessionProtocolEventDisconnect through the machine (the spec's RelayConnected → Paired transition) before tearing down the QUIC primary; this gives the spec model a defined post-close state instead of the current 'state freezes at RelayConnected and goroutines wind down' shape.
    - The hand-rolled per-stream sub-stream demux (clientAcceptLoop) stays above the machine — docs/session-protocol.md §Boundaries explicitly puts StreamChannel I/O above the executor. Datagram routing (clientDatagramLoop) migrates onto the executor's per-channel datagram surface so the relay_datagram → deliver_recv_datagram path actually fires through HandleEvent. Replace the channel-based dg.rx queue on *Datagram with the executor's chanDgWaiters / chanDgBuffers semantics, or document why the channel form is kept.
    - All existing root-package tests pass (TestE2ESingleClientChat, TestE2EMultiStreamMultiDatagram, TestE2EMultiClient, TestActivation_*). New activation_test assertions verify the machine on the Session is at RelayConnected post-Connect / post-Accept and at Paired post-Close.
    - Conn keeps its own executor field for now — pairing.go and pigeon-bridge still consume it; full Conn removal is T39.5 → T39.6 territory. make bullseye stays green.
    context: |-
      Discovered while scoping T39.3 (2026-05-06): the executor (executor.go, ~1000 lines) and the path-switching / LAN upgrade machinery were never ported across when T22 introduced the multi-tenant Session/Listener API. The post-T22 Session re-implemented transport-side responsibilities as hand-rolled goroutines that bypass the SessionMachine entirely.

      User direction (2026-05-06): "Do the port. I want the entire legacy approach stripped out." This sub-target is the first phase of that strip.

      **Architectural finding (2026-05-06)**: the SessionMachine spec was written around Conn's single-primary-stream model (events like app_send / relay_stream_data presume one ongoing stream of mixed-type messages). Session uses per-named-sub-stream I/O instead, which docs/session-protocol.md §Boundaries explicitly puts ABOVE the machine. So an honest port doesn't replace clientAcceptLoop — that loop's per-stream demux is already correct-by-spec. What the executor genuinely owns on Session: (a) persisting the activation machine; (b) disconnect on Close; (c) datagram demux (the one I/O path the spec puts through the loop); (d) future health monitor / LAN.

      Non-goal: this sub-target does NOT yet wire LAN upgrade into Session. The current Session is relay-only in production; LAN upgrade is gated on T37 (Swift Ngtcp2Transport) and T43 (STUN-reflexive) on the codepath side.
    depends_on:
    - T39.1
    origin: manual
    discovered: 2026-05-06
    achieved: 2026-05-06
