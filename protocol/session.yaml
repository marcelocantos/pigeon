# Unified session protocol: pairing + transport management.
#
# Single state machine covering the entire session lifecycle from
# initial pairing through transport path switching. Three actors:
# backend, client, relay.
#
# Phase 1 — Pairing: ECDH key exchange, confirmation code verification,
# device secret establishment. The "cli" actor from the original pairing
# spec is folded into backend as local actions (user input, not protocol).
#
# Phase 2 — Transport: relay (permanent baseline) + alt-pair candidates (e.g. LAN host, future STUN srflx).
# Health monitoring, exponential backoff, resource lifecycle management.
#
# The transition from Phase 1 to Phase 2 is:
#   backend: SessionActive → RelayConnected (on session_established)
#   client:  SessionActive → RelayConnected (on session_established)
#
# For reconnection with a saved PairingRecord, the executor starts at
# RelayConnected directly, skipping Phase 1.

name: Session
one_shot: false
channel_bound: 3

# Protocol wire constants — shared across all platforms.
# Protogen generates these as typed constants in Go, Swift, Kotlin, and TypeScript.
wire_constants:
  # Datagram frame types (first byte of each datagram).
  - {name: dg_conn_whole,    value: 0x00, type: byte, group: datagram_framing, desc: 'conn-level single-frame datagram'}
  - {name: dg_ping,          value: 0x10, type: byte, group: datagram_framing, desc: 'health ping on direct path'}
  - {name: dg_pong,          value: 0x11, type: byte, group: datagram_framing, desc: 'health pong on direct path'}
  - {name: dg_conn_fragment, value: 0x40, type: byte, group: datagram_framing, desc: 'conn-level multi-frame datagram'}
  - {name: dg_chan_whole,     value: 0x80, type: byte, group: datagram_framing, desc: 'channel single-frame datagram'}
  - {name: dg_chan_fragment,  value: 0xC0, type: byte, group: datagram_framing, desc: 'channel multi-frame datagram'}

  # Datagram structure sizes.
  - {name: frag_header_size, value: 8, type: int, group: datagram_framing, desc: 'fragment header: msgID(4) + fragIdx(2) + totalFrags(2)'}
  - {name: chan_id_size,     value: 2, type: int, group: datagram_framing, desc: 'channel ID prefix size in bytes'}

  # Datagram limits.
  - {name: max_datagram_payload, value: 1200, type: int, group: datagram_limits, desc: 'max payload per QUIC datagram (bytes)'}
  - {name: fragment_timeout_ms,  value: 5000, type: duration_ms, group: datagram_limits, desc: 'fragment reassembly timeout'}

  # Internal message types (first byte of encrypted stream plaintext).
  - {name: frame_app,            value: 0x00, type: byte, group: message_framing, desc: 'application data'}
  - {name: frame_candidates,     value: 0x01, type: byte, group: message_framing, desc: 'candidate set advertisement (relay control channel)'}
  - {name: frame_cutover,        value: 0x02, type: byte, group: message_framing, desc: 'transport cutover marker'}
  - {name: frame_pair_check,     value: 0x03, type: byte, group: message_framing, desc: 'candidate-pair connectivity-check challenge (on candidate pipe)'}
  - {name: frame_pair_check_ack, value: 0x04, type: byte, group: message_framing, desc: 'candidate-pair connectivity-check ack / implicit nomination (on candidate pipe)'}

  # Candidate kinds. Surfaced as wire-level discriminators on Candidate
  # records carried inside the `candidates` message. Phase 1 ships `host`
  # (LAN-direct). `srflx` is reserved for STUN-reflexive candidates
  # (🎯T43). Additional kinds (e.g. `relay-of` for cascaded TURN) plug
  # in by adding entries here without FSM changes.
  - {name: cand_host,  value: 'host',  type: string, group: candidates, desc: 'host candidate (local interface address; what LAN-direct uses)'}
  - {name: cand_srflx, value: 'srflx', type: string, group: candidates, desc: 'server-reflexive candidate (STUN-derived public address; Phase 1 STUN target)'}

  # Stream message framing.
  - {name: max_message_size,    value: 1048576, type: int, group: message_framing, desc: 'max stream message size (1 MiB)'}
  - {name: length_prefix_size,  value: 4, type: int, group: message_framing, desc: 'big-endian length prefix size'}

  # Health monitoring.
  - {name: ping_interval_ms,    value: 5000, type: duration_ms, group: health, desc: 'health ping interval'}
  - {name: pong_timeout_ms,     value: 4000, type: duration_ms, group: health, desc: 'pong reply timeout'}
  - {name: max_ping_failures,   value: 3, type: int, group: health, desc: 'consecutive failures before fallback'}
  - {name: max_backoff_level,   value: 5, type: int, group: health, desc: 'exponential backoff cap'}

  # Channel key derivation info strings.
  - {name: stream_channel_opener_suffix, value: ':o2a', type: string, group: channel_keys, desc: 'HKDF info suffix for opener→acceptor stream key'}
  - {name: stream_channel_accept_suffix, value: ':a2o', type: string, group: channel_keys, desc: 'HKDF info suffix for acceptor→opener stream key'}
  - {name: dg_channel_send_suffix,       value: ':dg:send', type: string, group: channel_keys, desc: 'HKDF info suffix for datagram send key'}
  - {name: dg_channel_recv_suffix,       value: ':dg:recv', type: string, group: channel_keys, desc: 'HKDF info suffix for datagram recv key'}

  # Channel ID derivation.
  - {name: channel_id_hash_multiplier, value: 31, type: int, group: channel_keys, desc: 'hash multiplier for channel name → uint16 ID'}

messages:
  # --- Phase 1: Pairing ---
  pair_hello:
    from: client
    to: backend
    desc: ECDH pubkey + pairing token
  pair_hello_ack:
    from: backend
    to: client
    desc: ECDH pubkey
  pair_confirm:
    from: backend
    to: client
    desc: signal to compute and display code
  pair_complete:
    from: backend
    to: client
    desc: encrypted device secret
  auth_request:
    from: client
    to: backend
    desc: encrypted auth with nonce
  auth_ok:
    from: backend
    to: client
    desc: session established

  # --- Phase 2: Transport ---
  candidates:
    from: backend
    to: client
    desc: 'set of local candidates (host, srflx, ...) + a per-candidate pair_check challenge (sent via relay)'
  pair_check:
    from: client
    to: backend
    desc: 'challenge echo + instance ID + pair_id under test (sent on the candidate-pair pipe)'
  pair_check_ack:
    from: backend
    to: client
    desc: 'pair_check accepted; this candidate-pair is nominated as the active path (sent on the candidate-pair pipe)'
  path_ping:
    from: backend
    to: client
    desc: 'health check on active direct path'
  path_pong:
    from: client
    to: backend
    desc: 'health check response'

# Declared events — trigger transitions from application or I/O layer.
# Events replace free-form internal strings with declared identifiers.
# Phases 1+2 events are listed; Phase 2 (transport) events are the
# primary focus for T18 executor integration.
events:
  # --- Phase 2: Transport (application surface) ---
  app_send: 'application wants to send a message'
  app_recv: 'application wants to receive a message'
  app_send_datagram: 'application wants to send a datagram'
  app_recv_datagram: 'application wants to receive a datagram'
  app_close: 'application wants to close the connection'
  app_force_fallback: 'application requests immediate fallback to relay'

  # --- Phase 2: Transport (I/O surface) ---
  relay_stream_data: 'data received on relay stream'
  relay_stream_error: 'error reading relay stream'
  relay_datagram: 'datagram received on relay'
  alt_stream_data: 'data received on alt-pair stream'
  alt_stream_error: 'error reading alt-pair stream'
  alt_datagram: 'datagram received on alt-pair'
  dial_ok: 'candidate dial succeeded (client has connection resources)'
  dial_failed: 'candidate dial failed'
  pair_check_ok: 'pair-check challenge verified (backend has connection resources)'
  ping_timeout: 'health ping timed out (no pong)'
  ping_tick: 'health ping timer fired'
  backoff_expired: 'backoff timer expired'
  candidates_timeout: 'candidate-pair check timed out with no verification'

# Declared commands — emitted by transitions for the executor.
# The executor carries out these commands as I/O operations or
# resource lifecycle management. The machine never does I/O directly.
commands:
  # I/O operations.
  write_active_stream: 'write data to the currently active path stream'
  send_active_datagram: 'send datagram on the currently active path'
  send_path_ping: 'send health ping on direct path'
  send_path_pong: 'send health pong on direct path'
  send_candidates: 'send candidate set via relay control channel'
  send_pair_check: 'send pair-check challenge on candidate connection'
  send_pair_check_ack: 'send pair-check ack on candidate connection'
  dial_candidate: 'initiate connection to candidate address'

  # Deliver to application.
  deliver_recv: 'deliver received data to blocked Recv() caller'
  deliver_recv_error: 'deliver error to blocked Recv() caller'
  deliver_recv_datagram: 'deliver received datagram to blocked RecvDatagram() caller'

  # Resource lifecycle.
  start_alt_stream_reader: 'start goroutine reading from alt-pair stream'
  stop_alt_stream_reader: 'stop alt-pair stream reader goroutine'
  start_alt_dg_reader: 'start goroutine reading from alt-pair datagrams'
  stop_alt_dg_reader: 'stop alt-pair datagram reader goroutine'
  start_monitor: 'start health ping timer for direct path'
  stop_monitor: 'stop health ping timer'
  start_pong_timeout: 'start timer expecting pong reply'
  cancel_pong_timeout: 'cancel pong reply timer (pong received)'
  start_backoff_timer: 'start exponential backoff timer'
  close_alt_path: 'close the alt-pair resources'

  # Notifications.
  signal_alt_ready: 'close the AltReady channel (alt-pair active)'
  reset_alt_ready: 'create a new AltReady channel (alt-pair inactive)'

  # Encryption mode.
  set_crypto_datagram: 'switch crypto channels to datagram mode'

actors:
  backend:
    initial: Idle
    states:
      # Superstate: all transport path states inherit data-forwarding.
      Connected:
        children: [RelayConnected, CandidatesAdvertised, AltPath, RelayBackoff]
        transitions:
          - {on: app_send, emits: [write_active_stream]}
          - {on: relay_stream_data, emits: [deliver_recv]}
          - {on: relay_stream_error, emits: [deliver_recv_error]}
          - {on: app_send_datagram, emits: [send_active_datagram]}
          - {on: relay_datagram, emits: [deliver_recv_datagram]}
      # Sub-superstate: alt-active states also handle alt-specific I/O.
      AltPath:
        children: [AltActive, AltDegraded]
        transitions:
          - {on: alt_stream_data, emits: [deliver_recv]}
          - {on: alt_datagram, emits: [deliver_recv_datagram]}
    transitions:
      # ============================================================
      # Phase 1: Pairing
      # ============================================================

      # Backend initiates pairing (triggered by local CLI).
      - from: Idle
        to: GenerateToken
        on: cli_init_pair
        do: generate_token
        updates:
          current_token: '"tok_1"'
          active_tokens: 'active_tokens \union {"tok_1"}'

      - from: GenerateToken
        to: RegisterRelay
        on: token_created
        do: register_relay

      - from: RegisterRelay
        to: WaitingForClient
        on: relay_registered
        updates:
          # Token published via backchannel (QR code, NFC, etc.).
          secret_published: 'TRUE'

      - from: WaitingForClient
        to: DeriveSecret
        on: recv pair_hello
        guard: token_valid
        do: derive_secret
        updates:
          received_client_pub: recv_msg.pubkey
          backend_ecdh_pub: '"backend_pub"'
          backend_shared_key: 'DeriveKey("backend_pub", recv_msg.pubkey)'
          backend_code: 'DeriveCode("backend_pub", recv_msg.pubkey)'

      - from: WaitingForClient
        to: Idle
        on: recv pair_hello
        guard: token_invalid

      - from: DeriveSecret
        to: SendAck
        on: ecdh_complete
        sends:
          - to: client
            msg: pair_hello_ack
            fields:
              pubkey: backend_ecdh_pub

      - from: SendAck
        to: WaitingForCode
        on: signal_code_display
        sends:
          - to: client
            msg: pair_confirm

      # Code entry is a local backend action (CLI prompt).
      - from: WaitingForCode
        to: ValidateCode
        on: cli_code_entered
        updates:
          received_code: cli_entered_code

      - from: ValidateCode
        to: StorePaired
        on: check_code
        guard: code_correct

      - from: ValidateCode
        to: Idle
        on: check_code
        guard: code_wrong
        updates:
          code_attempts: code_attempts + 1

      - from: StorePaired
        to: Paired
        on: finalise
        do: store_device
        sends:
          - to: client
            msg: pair_complete
            fields:
              key: backend_shared_key
              secret: '"dev_secret_1"'
        updates:
          device_secret: '"dev_secret_1"'
          paired_devices: 'paired_devices \union {"device_1"}'
          active_tokens: 'active_tokens \ {current_token}'
          used_tokens: 'used_tokens \union {current_token}'

      - from: Paired
        to: AuthCheck
        on: recv auth_request
        updates:
          received_device_id: recv_msg.device_id
          received_auth_nonce: recv_msg.nonce

      - from: AuthCheck
        to: SessionActive
        on: verify
        guard: device_known
        do: verify_device
        sends:
          - to: client
            msg: auth_ok
        updates:
          auth_nonces_used: 'auth_nonces_used \union {received_auth_nonce}'

      - from: AuthCheck
        to: Idle
        on: verify
        guard: device_unknown

      # ============================================================
      # Phase 1 → Phase 2 bridge
      # ============================================================
      - from: SessionActive
        to: RelayConnected
        on: session_established

      # ============================================================
      # Phase 2: Transport management
      # ============================================================

      - from: RelayConnected
        to: CandidatesAdvertised
        on: candidates_gathered
        sends:
          - to: client
            msg: candidates
            fields:
              set: local_candidates
              challenge: local_pair_check_challenge
        emits: [send_candidates]

      - from: CandidatesAdvertised
        to: AltActive
        on: recv pair_check
        guard: challenge_valid
        do: activate_lan
        sends:
          - to: client
            msg: pair_check_ack
        updates:
          ping_failures: '0'
          backoff_level: '0'
          b_active_path: '"alt"'
          b_dispatcher_path: '"alt"'
          monitor_target: '"alt"'
          alt_signal: '"ready"'
        emits:
          - send_pair_check_ack
          - start_alt_stream_reader
          - start_alt_dg_reader
          - start_monitor
          - signal_alt_ready
          - set_crypto_datagram

      - from: CandidatesAdvertised
        to: RelayConnected
        on: recv pair_check
        guard: challenge_invalid

      - from: CandidatesAdvertised
        to: RelayBackoff
        on: candidates_timeout
        updates:
          backoff_level: 'Min(backoff_level + 1, max_backoff_level)'
          alt_signal: '"pending"'
        emits: [reset_alt_ready, start_backoff_timer]

      - from: AltActive
        to: AltActive
        on: ping_tick
        sends:
          - to: client
            msg: path_ping
        emits: [send_path_ping, start_pong_timeout]

      - from: AltActive
        to: AltDegraded
        on: ping_timeout
        updates:
          ping_failures: '1'

      - from: AltDegraded
        to: AltDegraded
        on: ping_tick
        sends:
          - to: client
            msg: path_ping
        emits: [send_path_ping, start_pong_timeout]

      # Alt-pair stream error triggers immediate fallback (no degradation).
      - from: AltActive
        to: RelayBackoff
        on: alt_stream_error
        do: fallback_to_relay
        updates:
          backoff_level: 'Min(backoff_level + 1, max_backoff_level)'
          b_active_path: '"relay"'
          b_dispatcher_path: '"relay"'
          monitor_target: '"none"'
          alt_signal: '"pending"'
          ping_failures: '0'
        emits:
          - stop_monitor
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready
          - start_backoff_timer

      - from: AltDegraded
        to: RelayBackoff
        on: alt_stream_error
        do: fallback_to_relay
        updates:
          backoff_level: 'Min(backoff_level + 1, max_backoff_level)'
          b_active_path: '"relay"'
          b_dispatcher_path: '"relay"'
          monitor_target: '"none"'
          alt_signal: '"pending"'
          ping_failures: '0'
        emits:
          - stop_monitor
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready
          - start_backoff_timer

      - from: AltDegraded
        to: AltActive
        on: recv path_pong
        do: reset_failures
        updates:
          ping_failures: '0'
        emits: [cancel_pong_timeout]

      - from: AltDegraded
        to: AltDegraded
        on: ping_timeout
        guard: under_max_failures
        updates:
          ping_failures: 'ping_failures + 1'

      - from: AltDegraded
        to: RelayBackoff
        on: ping_timeout
        guard: at_max_failures
        do: fallback_to_relay
        updates:
          backoff_level: 'Min(backoff_level + 1, max_backoff_level)'
          b_active_path: '"relay"'
          b_dispatcher_path: '"relay"'
          monitor_target: '"none"'
          alt_signal: '"pending"'
          ping_failures: '0'
        emits:
          - stop_monitor
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready
          - start_backoff_timer

      - from: RelayBackoff
        to: CandidatesAdvertised
        on: backoff_expired
        fairness: strong
        sends:
          - to: client
            msg: candidates
            fields:
              set: local_candidates
              challenge: local_pair_check_challenge
        emits: [send_candidates]

      - from: RelayBackoff
        to: CandidatesAdvertised
        on: candidates_changed
        sends:
          - to: client
            msg: candidates
            fields:
              set: local_candidates
              challenge: local_pair_check_challenge
        updates:
          backoff_level: '0'
        emits: [send_candidates]

      - from: RelayConnected
        to: CandidatesAdvertised
        on: candidates_refresh_tick
        guard: local_candidates_available
        sends:
          - to: client
            msg: candidates
            fields:
              set: local_candidates
              challenge: local_pair_check_challenge
        emits: [send_candidates]

      # Force fallback from any alt-pair state to relay.
      - from: CandidatesAdvertised
        to: RelayConnected
        on: app_force_fallback
        updates:
          alt_signal: '"pending"'
        emits: [reset_alt_ready]

      - from: AltActive
        to: RelayBackoff
        on: app_force_fallback
        do: fallback_to_relay
        updates:
          backoff_level: 'Min(backoff_level + 1, max_backoff_level)'
          b_active_path: '"relay"'
          b_dispatcher_path: '"relay"'
          monitor_target: '"none"'
          alt_signal: '"pending"'
          ping_failures: '0'
        emits:
          - stop_monitor
          - cancel_pong_timeout
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready
          - start_backoff_timer

      - from: AltDegraded
        to: RelayBackoff
        on: app_force_fallback
        do: fallback_to_relay
        updates:
          backoff_level: 'Min(backoff_level + 1, max_backoff_level)'
          b_active_path: '"relay"'
          b_dispatcher_path: '"relay"'
          monitor_target: '"none"'
          alt_signal: '"pending"'
          ping_failures: '0'
        emits:
          - stop_monitor
          - cancel_pong_timeout
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready
          - start_backoff_timer

      # Re-enter pairing on disconnect.
      - from: RelayConnected
        to: Paired
        on: disconnect

  client:
    initial: Idle
    states:
      # Superstate: all transport path states inherit data-forwarding.
      Connected:
        children: [RelayConnected, PairDialing, PairChecking, AltDataPath, RelayFallback]
        transitions:
          - {on: app_send, emits: [write_active_stream]}
          - {on: relay_stream_data, emits: [deliver_recv]}
          - {on: relay_stream_error, emits: [deliver_recv_error]}
          - {on: app_send_datagram, emits: [send_active_datagram]}
          - {on: relay_datagram, emits: [deliver_recv_datagram]}
      # AltActive also handles alt-specific I/O.
      AltDataPath:
        children: [AltActive]
        transitions:
          - {on: alt_stream_data, emits: [deliver_recv]}
          - {on: alt_datagram, emits: [deliver_recv_datagram]}
    transitions:
      # ============================================================
      # Phase 1: Pairing
      # ============================================================

      - from: Idle
        to: ObtainBackchannelSecret
        on: backchannel_received

      - from: ObtainBackchannelSecret
        to: ConnectRelay
        on: secret_parsed

      - from: ConnectRelay
        to: GenKeyPair
        on: relay_connected

      - from: GenKeyPair
        to: WaitAck
        on: key_pair_generated
        do: send_pair_hello
        sends:
          - to: backend
            msg: pair_hello
            fields:
              token: current_token
              pubkey: '"client_pub"'

      - from: WaitAck
        to: E2EReady
        on: recv pair_hello_ack
        do: derive_secret
        updates:
          received_backend_pub: recv_msg.pubkey
          client_shared_key: 'DeriveKey("client_pub", recv_msg.pubkey)'

      - from: E2EReady
        to: ShowCode
        on: recv pair_confirm
        updates:
          client_code: 'DeriveCode(received_backend_pub, "client_pub")'

      - from: ShowCode
        to: WaitPairComplete
        on: code_displayed

      - from: WaitPairComplete
        to: Paired
        on: recv pair_complete
        do: store_secret

      - from: Paired
        to: Reconnect
        on: app_launch

      - from: Reconnect
        to: SendAuth
        on: relay_connected
        sends:
          - to: backend
            msg: auth_request
            fields:
              device_id: '"device_1"'
              secret: device_secret
              nonce: '"nonce_1"'
              key: client_shared_key

      - from: SendAuth
        to: SessionActive
        on: recv auth_ok

      # ============================================================
      # Phase 1 → Phase 2 bridge
      # ============================================================
      - from: SessionActive
        to: RelayConnected
        on: session_established

      # ============================================================
      # Phase 2: Transport management
      # ============================================================

      - from: RelayConnected
        to: PairDialing
        on: recv candidates
        guard: alt_enabled
        do: dial_candidate
        emits: [dial_candidate]

      - from: RelayConnected
        to: RelayConnected
        on: recv candidates
        guard: alt_disabled

      - from: PairDialing
        to: PairChecking
        on: dial_ok
        sends:
          - to: backend
            msg: pair_check
            fields:
              challenge: received_pair_check_challenge
              instance_id: instance_id
        emits: [send_pair_check]

      - from: PairDialing
        to: RelayConnected
        on: dial_failed

      - from: PairChecking
        to: AltActive
        on: recv pair_check_ack
        do: activate_lan
        updates:
          c_active_path: '"alt"'
          c_dispatcher_path: '"alt"'
          alt_signal: '"ready"'
        emits:
          - start_alt_stream_reader
          - start_alt_dg_reader
          - signal_alt_ready
          - set_crypto_datagram

      - from: PairChecking
        to: RelayConnected
        on: verify_timeout
        updates:
          c_dispatcher_path: '"relay"'

      - from: AltActive
        to: AltActive
        on: recv path_ping
        sends:
          - to: backend
            msg: path_pong
        emits: [send_path_pong]

      - from: AltActive
        to: RelayFallback
        on: alt_error
        do: fallback_to_relay
        updates:
          c_active_path: '"relay"'
          c_dispatcher_path: '"relay"'
          alt_signal: '"pending"'
        emits:
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready

      - from: AltActive
        to: RelayFallback
        on: alt_stream_error
        do: fallback_to_relay
        updates:
          c_active_path: '"relay"'
          c_dispatcher_path: '"relay"'
          alt_signal: '"pending"'
        emits:
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready

      - from: RelayFallback
        to: RelayConnected
        on: relay_ok

      - from: AltActive
        to: PairDialing
        on: recv candidates
        guard: alt_enabled
        do: dial_candidate
        emits:
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - dial_candidate

      # Force fallback from any alt-pair state to relay.
      - from: PairDialing
        to: RelayConnected
        on: app_force_fallback

      - from: PairChecking
        to: RelayConnected
        on: app_force_fallback
        updates:
          c_dispatcher_path: '"relay"'
        emits:
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path

      - from: AltActive
        to: RelayConnected
        on: app_force_fallback
        do: fallback_to_relay
        updates:
          c_active_path: '"relay"'
          c_dispatcher_path: '"relay"'
          alt_signal: '"pending"'
        emits:
          - stop_alt_stream_reader
          - stop_alt_dg_reader
          - close_alt_path
          - reset_alt_ready

      # Re-enter pairing on disconnect.
      - from: RelayConnected
        to: Paired
        on: disconnect

  relay:
    initial: Idle
    transitions:
      - from: Idle
        to: BackendRegistered
        on: backend_register

      - from: BackendRegistered
        to: Bridged
        on: client_connect
        do: bridge_streams
        updates:
          relay_bridge: '"active"'

      - from: Bridged
        to: BackendRegistered
        on: client_disconnect
        do: unbridge
        updates:
          relay_bridge: '"idle"'

      - from: BackendRegistered
        to: Idle
        on: backend_disconnect

structs:
  ECDHState:
    backend_pub:
      type: string
      initial: '""'
      desc: backend ECDH public key
    client_pub:
      type: string
      initial: '""'
      desc: pubkey received from client
    shared_key:
      type: string
      initial: '""'
      desc: ECDH-derived shared key
    code:
      type: string
      initial: '""'
      desc: confirmation code derived from pubkeys

  TokenState:
    current:
      type: string
      initial: '""'
      desc: pairing token currently in play
    active:
      type: set<string>
      initial: '{}'
      desc: set of valid (non-revoked) tokens
    used:
      type: set<string>
      initial: '{}'
      desc: set of revoked tokens

  BackendPathState:
    active_path:
      type: string
      initial: '"relay"'
      desc: which path carries traffic
    dispatcher_path:
      type: string
      initial: '"relay"'
      desc: datagram dispatcher binding
    monitor_target:
      type: string
      initial: '"none"'
      desc: health monitor target
    alt_signal:
      type: string
      initial: '"pending"'
      desc: AltReady notification state

  ClientPathState:
    active_path:
      type: string
      initial: '"relay"'
      desc: which path carries traffic
    dispatcher_path:
      type: string
      initial: '"relay"'
      desc: datagram dispatcher binding

  # Candidate is the wire-level descriptor exchanged in the `candidates`
  # message. Each peer enumerates its reachable transport addresses
  # (host = local interface; srflx = STUN-reflexive; ...) and emits a
  # set of these records. The pair_check / pair_check_ack handshake
  # validates a specific local↔remote pair; nomination picks the
  # highest-priority pair whose check has completed.
  Candidate:
    kind:
      type: string
      initial: '"host"'
      desc: 'candidate kind discriminator: cand_host / cand_srflx / ...'
    addr:
      type: string
      initial: '""'
      desc: 'transport address (host:port) the peer should dial'
    priority:
      type: int
      initial: '0'
      desc: 'pair-priority used during nomination (higher wins; ICE-style numbering recommended)'
    cand_id:
      type: string
      initial: '""'
      desc: 'stable per-session identifier; pair IDs are <<local_cand_id, remote_cand_id>>'

vars:
  # --- Phase 1: Pairing ---
  current_token:
    type: string
    initial: '"none"'
    desc: pairing token currently in play
  active_tokens:
    type: set<string>
    initial: '{}'
    desc: set of valid (non-revoked) tokens
  used_tokens:
    type: set<string>
    initial: '{}'
    desc: set of revoked tokens
  backend_ecdh_pub:
    type: string
    initial: '"none"'
    desc: backend ECDH public key
  received_client_pub:
    type: string
    initial: '"none"'
    desc: pubkey backend received in pair_hello
  received_backend_pub:
    type: string
    initial: '"none"'
    desc: pubkey client received in pair_hello_ack
  backend_shared_key:
    type: string
    initial: '<<"none">>'
    desc: ECDH key derived by backend
  client_shared_key:
    type: string
    initial: '<<"none">>'
    desc: ECDH key derived by client
  backend_code:
    type: string
    initial: '<<"none">>'
    desc: code computed by backend
  client_code:
    type: string
    initial: '<<"none">>'
    desc: code computed by client
  received_code:
    type: string
    initial: '<<"none">>'
    desc: code entered via CLI
  cli_entered_code:
    type: string
    initial: '<<"none">>'
    desc: staging for CLI code input
  code_attempts:
    type: int
    initial: '0'
    desc: failed code submission attempts
  device_secret:
    type: string
    initial: '"none"'
    desc: persistent device secret
  paired_devices:
    type: set<string>
    initial: '{}'
    desc: device IDs that completed pairing
  received_device_id:
    type: string
    initial: '"none"'
    desc: device_id from auth_request
  auth_nonces_used:
    type: set<string>
    initial: '{}'
    desc: set of consumed auth nonces
  received_auth_nonce:
    type: string
    initial: '"none"'
    desc: nonce from auth_request
  secret_published:
    type: bool
    initial: 'FALSE'
    desc: whether token has been published via backchannel
  recv_msg:
    type: string
    initial: '[type |-> "none"]'
    desc: last received message (staging)

  # --- Adversary (Phase 1 only) ---
  adversary_keys:
    type: set<string>
    initial: '{}'
    desc: encryption keys the adversary knows
  adv_ecdh_pub:
    type: string
    initial: '"adv_pub"'
    desc: adversary's ECDH public key
  adv_saved_client_pub:
    type: string
    initial: '"none"'
    desc: real client pubkey saved during MitM
  adv_saved_server_pub:
    type: string
    initial: '"none"'
    desc: real backend pubkey saved during MitM

  # --- Phase 2: Transport ---
  local_pair_check_challenge:
    type: string
    initial: '"none"'
    desc: 32-byte random challenge for pair_check exchange
  received_pair_check_challenge:
    type: string
    initial: '"none"'
    desc: challenge most recently received in pair_check
  instance_id:
    type: string
    initial: '"none"'
    desc: relay instance ID
  ping_failures:
    type: int
    initial: '0'
    desc: consecutive failed pings
  max_ping_failures:
    type: int
    initial: '3'
    desc: threshold before fallback
  backoff_level:
    type: int
    initial: '0'
    desc: exponential backoff level
  max_backoff_level:
    type: int
    initial: '5'
    desc: backoff cap
  local_listen_addr:
    type: string
    initial: '"none"'
    desc: local listening address (host candidate)

  # --- Candidate-pair state (Phase 2) ---
  # TLA+ models candidate identities abstractly as opaque strings.
  # The per-language Candidate struct (kind / addr / priority / cand_id)
  # is the wire-level view; here we track only the identifier sets the
  # FSM needs to reason about pair formation and nomination.
  local_candidates:
    type: set<string>
    initial: '{}'
    desc: candidate IDs this peer gathered locally and advertised via candidates message
  remote_candidates:
    type: set<string>
    initial: '{}'
    desc: candidate IDs this peer received in the peer's candidates message
  pair_check_acks:
    type: set<string>
    initial: '{}'
    desc: pair IDs for which a pair_check_ack has been observed (nomination universe)
  active_pair_id:
    type: string
    initial: '"none"'
    desc: 'pair ID currently nominated as the active alt path; "none" when on relay'

  # --- Resource lifecycle (Phase 2) ---
  b_active_path:
    type: string
    initial: '"relay"'
    desc: backend active path
  c_active_path:
    type: string
    initial: '"relay"'
    desc: client active path
  b_dispatcher_path:
    type: string
    initial: '"relay"'
    desc: backend datagram dispatcher binding
  c_dispatcher_path:
    type: string
    initial: '"relay"'
    desc: client datagram dispatcher binding
  monitor_target:
    type: string
    initial: '"none"'
    desc: health monitor target
  alt_signal:
    type: string
    initial: '"pending"'
    desc: AltReady notification state
  relay_bridge:
    type: string
    initial: '"idle"'
    desc: relay bridge state

guards:
  # Phase 1
  token_valid: 'recv_msg.token \in active_tokens'
  token_invalid: 'recv_msg.token \notin active_tokens'
  code_correct: received_code = backend_code
  code_wrong: received_code /= backend_code
  device_known: 'received_device_id \in paired_devices'
  device_unknown: 'received_device_id \notin paired_devices'
  nonce_fresh: 'received_auth_nonce \notin auth_nonces_used'
  # Phase 2
  challenge_valid: 'received_pair_check_challenge = local_pair_check_challenge'
  challenge_invalid: 'received_pair_check_challenge /= local_pair_check_challenge'
  alt_enabled: 'TRUE'
  alt_disabled: 'FALSE'
  local_candidates_available: 'local_listen_addr /= "none"'
  under_max_failures: 'ping_failures + 1 < max_ping_failures'
  at_max_failures: 'ping_failures + 1 >= max_ping_failures'

operators:
  KeyRank:
    params: k
    expr: 'CASE k = "adv_pub" -> 0 [] k = "client_pub" -> 1 [] k = "backend_pub" -> 2 [] OTHER -> 3'
    desc: deterministic ordering for ECDH
  DeriveKey:
    params: a, b
    expr: 'IF KeyRank(a) <= KeyRank(b) THEN <<"ecdh", a, b>> ELSE <<"ecdh", b, a>>'
    desc: symbolic ECDH
  DeriveCode:
    params: a, b
    expr: 'IF KeyRank(a) <= KeyRank(b) THEN <<"code", a, b>> ELSE <<"code", b, a>>'
    desc: confirmation code from pubkeys
  Min:
    params: a, b
    expr: 'IF a < b THEN a ELSE b'
    desc: minimum of two values
  ValidPairingRecord:
    params: r
    expr: 'r.peer_instance_id /= "none" /\ r.peer_eph_pub /= "none"'
    desc: 'Interface contract with PairingCeremony.tla: a PairingRecord is well-formed iff it carries a non-default peer instance ID and ephemeral pubkey. SessionMachine treats this as an axiom over its initial state — the session begins with a record that PairingCeremony.tla''s PairingProducesValidRecord postcondition has already established.'

# Phases group states for hierarchical diagramming and TLA+ splitting.
# The names here become PlantUML superstates. For TLA+ export, each
# phase generates an independent spec with only its relevant variables.
phases:
  Pairing:
    states:
      # Backend pairing states
      - Idle
      - GenerateToken
      - RegisterRelay
      - WaitingForClient
      - DeriveSecret
      - SendAck
      - WaitingForCode
      - ValidateCode
      - StorePaired
      - Paired
      - AuthCheck
      - SessionActive
      # Client pairing states
      - ObtainBackchannelSecret
      - ConnectRelay
      - GenKeyPair
      - WaitAck
      - E2EReady
      - ShowCode
      - WaitPairComplete
      - Reconnect
      - SendAuth
    vars:
      - current_token
      - active_tokens
      - used_tokens
      - backend_ecdh_pub
      - received_client_pub
      - received_backend_pub
      - backend_shared_key
      - client_shared_key
      - backend_code
      - client_code
      - received_code
      - cli_entered_code
      - code_attempts
      - device_secret
      - paired_devices
      - received_device_id
      - auth_nonces_used
      - received_auth_nonce
      - secret_published
      - recv_msg
      - adversary_keys
      - adv_ecdh_pub
      - adv_saved_client_pub
      - adv_saved_server_pub
    adversary: true
  Transport:
    states:
      # Backend transport states
      - RelayConnected
      - CandidatesAdvertised
      - AltActive
      - AltDegraded
      - RelayBackoff
      # Client transport states
      - PairDialing
      - PairChecking
      - RelayFallback
    vars:
      - local_pair_check_challenge
      - received_pair_check_challenge
      - instance_id
      - ping_failures
      - max_ping_failures
      - backoff_level
      - max_backoff_level
      - local_listen_addr
      - local_candidates
      - remote_candidates
      - pair_check_acks
      - active_pair_id
      - b_active_path
      - c_active_path
      - b_dispatcher_path
      - c_dispatcher_path
      - monitor_target
      - alt_signal
    adversary: false

# The adversary is only active during the pairing phase. Once the
# backend reaches transport states, the adversary self-disables.
# This prevents combinatorial explosion from adversary interleavings
# with transport events that can never interact with pairing.
adversary_guard: 'backend_state \notin {backend_RelayConnected, backend_CandidatesAdvertised, backend_AltActive, backend_AltDegraded, backend_RelayBackoff}'

adversary:
  - name: QR_shoulder_surf
    desc: observe QR code content
    code: |
      await current_token /= "none";
      adversary_knowledge := adversary_knowledge \union {[type |-> "qr_token", token |-> current_token]};
  - name: MitM_pair_hello
    desc: intercept pair_hello and substitute adversary pubkey
    code: |
      await Len(chan_client_backend) > 0 /\ Head(chan_client_backend).type = MSG_pair_hello;
      adv_saved_client_pub := Head(chan_client_backend).pubkey;
      chan_client_backend := <<[type |-> MSG_pair_hello, token |-> Head(chan_client_backend).token, pubkey |-> adv_ecdh_pub]>> \o Tail(chan_client_backend);
  - name: MitM_pair_hello_ack
    desc: intercept pair_hello_ack and substitute adversary pubkey
    code: |
      await Len(chan_backend_client) > 0 /\ Head(chan_backend_client).type = MSG_pair_hello_ack;
      adv_saved_server_pub := Head(chan_backend_client).pubkey;
      adversary_keys := adversary_keys \union {DeriveKey(adv_ecdh_pub, adv_saved_server_pub), DeriveKey(adv_ecdh_pub, adv_saved_client_pub)};
      chan_backend_client := <<[type |-> MSG_pair_hello_ack, pubkey |-> adv_ecdh_pub]>> \o Tail(chan_backend_client);
  - name: MitM_reencrypt_secret
    desc: decrypt pair_complete with MitM key
    code: |
      await Len(chan_backend_client) > 0 /\ Head(chan_backend_client).type = MSG_pair_complete /\ Head(chan_backend_client).key \in adversary_keys;
      with msg = Head(chan_backend_client) do
        adversary_knowledge := adversary_knowledge \union {[type |-> "plaintext_secret", secret |-> msg.secret]};
        chan_backend_client := <<[type |-> MSG_pair_complete, key |-> DeriveKey(adv_ecdh_pub, adv_saved_client_pub), secret |-> msg.secret]>> \o Tail(chan_backend_client);
      end with;
  - name: concurrent_pair
    desc: race a forged pair_hello using shoulder-surfed token
    code: |
      await \E m \in adversary_knowledge : m = [type |-> "qr_token", token |-> current_token];
      await Len(chan_client_backend) < 3;
      chan_client_backend := Append(chan_client_backend, [type |-> MSG_pair_hello, token |-> current_token, pubkey |-> adv_ecdh_pub]);
  - name: token_bruteforce
    desc: send pair_hello with fabricated token
    code: |
      await Len(chan_client_backend) < 3;
      chan_client_backend := Append(chan_client_backend, [type |-> MSG_pair_hello, token |-> "fake_token", pubkey |-> adv_ecdh_pub]);
  - name: code_guess
    desc: submit fabricated confirmation code
    code: |
      await backend_state = backend_WaitingForCode;
      cli_entered_code := <<"guess", "000000">>;
  - name: session_replay
    desc: replay captured auth_request with stale nonce
    code: |
      await Len(chan_client_backend) < 3;
      await \E m \in adversary_knowledge : m.type = MSG_auth_request;
      with msg \in {m \in adversary_knowledge : m.type = MSG_auth_request} do
        chan_client_backend := Append(chan_client_backend, msg);
      end with;

constants:
  - name: Challenges
    type: set<string>
    values: [c1, c2]
    desc: possible challenge values (verifies protocol works for any challenge)

properties:
  # --- Phase 1: Security ---
  - name: NoTokenReuse
    kind: invariant
    expr: 'used_tokens \intersect active_tokens = {}'
    desc: A revoked pairing token is never accepted again
  - name: MitMDetectedByCodeMismatch
    kind: invariant
    expr: '(backend_shared_key \in adversary_keys /\ backend_code /= <<"none">> /\ client_code /= <<"none">>) => backend_code /= client_code'
    desc: MitM produces mismatched codes
  - name: MitMPrevented
    kind: invariant
    expr: 'backend_shared_key \in adversary_keys => backend_state \notin {backend_StorePaired, backend_Paired, backend_AuthCheck, backend_SessionActive}'
    desc: Compromised key prevents pairing completion
  - name: AuthRequiresCompletedPairing
    kind: invariant
    expr: 'backend_state = backend_SessionActive => received_device_id \in paired_devices'
    desc: Session requires completed pairing
  - name: NoNonceReuse
    kind: invariant
    expr: 'backend_state = backend_SessionActive => received_auth_nonce \notin (auth_nonces_used \ {received_auth_nonce})'
    desc: Each auth nonce accepted at most once
  - name: DeviceSecretSecrecy
    kind: invariant
    expr: '\A m \in adversary_knowledge : "type" \in DOMAIN m => m.type /= "plaintext_secret"'
    desc: Adversary never learns device secret

  # --- Phase 2: Transport ---
  - name: PathConsistency
    kind: invariant
    expr: 'b_active_path \in {"relay", "alt"} /\ c_active_path \in {"relay", "alt"}'
    desc: Paths are always valid
  - name: BackoffBounded
    kind: invariant
    expr: 'backoff_level <= max_backoff_level'
    desc: Backoff never exceeds cap
  - name: BackoffResetsOnSuccess
    kind: invariant
    expr: 'backend_state = backend_AltActive => backoff_level = 0'
    desc: alt-pair success resets backoff

  # --- Resource lifecycle ---
  - name: DispatcherAlwaysBound
    kind: invariant
    expr: 'b_dispatcher_path \in {"relay", "alt"} /\ c_dispatcher_path \in {"relay", "alt"}'
    desc: Dispatchers always bound to valid path
  - name: BackendDispatcherMatchesActive
    kind: invariant
    expr: 'backend_state = backend_AltActive => b_dispatcher_path = "alt"'
    desc: Backend dispatcher on alt-pair when alt-pair active
  - name: ClientDispatcherMatchesActive
    kind: invariant
    expr: 'client_state = client_AltActive => c_dispatcher_path = "alt"'
    desc: Client dispatcher on alt-pair when alt-pair active
  - name: MonitorOnlyWhenAlt
    kind: invariant
    expr: 'monitor_target = "alt" => backend_state \in {backend_AltActive, backend_AltDegraded}'
    desc: Monitor only pings when alt-pair is active or degraded
  # AltSignalPendingOnFallback removed: alt_signal is shared between
  # actors but updated independently, creating valid states where the
  # backend has fallen back but the client hasn't reset the signal yet.
  # In the Go implementation, each Conn has its own altReady channel.

  # --- Leads-to (progress guarantees) ---
  - name: FallbackLeadsToReadvertise
    kind: leads_to
    from_expr: 'backend_state = backend_RelayBackoff'
    to_expr: 'backend_state = backend_CandidatesAdvertised'
    desc: After fallback, backend eventually re-advertises candidates
  - name: DegradedLeadsToResolutionOrFallback
    kind: leads_to
    from_expr: 'backend_state = backend_AltDegraded'
    to_expr: 'backend_state \in {backend_AltActive, backend_RelayBackoff}'
    desc: Degraded state eventually resolves (recovery or fallback)
