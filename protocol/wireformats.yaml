#
# One-shot byte-format specifications. Each entry is a flat encoder /
# decoder pair, emitted in every language target by cmd/protogen.
#
# Field kinds:
#   u32_be        — 4 bytes, big-endian uint32 (always present)
#   varint        — Go-style unsigned varint (1..10 bytes)
#   string_to_end — remaining bytes, decoded as UTF-8 string
#
# The relay greeting is an ASCII colon-delimited union of variants. We
# model it as one named variant per code path rather than torturing the
# field DSL into describing arbitrary colon-separated unions.
name: pigeon_wire

formats:

  # T22 stream-name binding header — written as the first message on
  # every stream the application opens. Under T45's remote-Listen L1,
  # each accepted client has its own end-to-end QUIC pipe; there is no
  # backend/client variant and no 4-byte clientTag prefix.
  - name: stream_header
    desc: First message on every stream — binds the stream to a name.
    fields:
      - { name: name, kind: string_with_varint_length }

  # Datagram channel-id framing — the *plaintext* layout before AEAD
  # encryption. AEAD itself is not part of this spec; the encoder
  # returns the plaintext to be encrypted. Under T45 there is no
  # backend-side clientTag prefix; the QUIC pipe IS the demux.
  - name: datagram_plaintext
    desc: Plaintext layout of a datagram before AEAD encryption.
    fields:
      - { name: channel_id, kind: varint }
      - { name: payload,    kind: bytes_to_end }

  # Relay greeting. Three top-level variants under T45's remote-Listen
  # L1 model:
  #
  #   register[:<token>[:<id>]]  — backend announces its identity.
  #                                Control plane; no traffic flows on
  #                                this connection.
  #   listen[:<token>[:<id>]]    — backend parks a fresh QUIC connection
  #                                for the relay to match against an
  #                                arriving client.
  #   connect:<id>               — client requests bridging to a
  #                                registered backend identity.
  #
  # The legacy `register-mux` greeting and the per-client clientTag
  # demux it required are gone — each accepted client gets its own
  # end-to-end QUIC pipe.
  - name: relay_greeting
    desc: Relay-side greeting sent on the primary stream after dial.
    union:
      - name: connect
        prefix: "connect:"
        fields:
          - { name: instance_id, kind: string_to_end }
      - name: register
        prefix: "register"
        # Optional colon-separated [token, instance_id] suffix. The
        # encoder takes both as strings; both empty produces the bare
        # "register" form (relay assigns an instance id and responds
        # with it). Empty token, non-empty id → "register::<id>".
        # Non-empty token, empty id → "register:<token>:". Both
        # non-empty → "register:<token>:<id>". The token field is
        # consumed by pigeon.Auth.VerifyRegister (T42).
        colon_suffix:
          - { name: token,       kind: string }
          - { name: instance_id, kind: string }
      - name: listen
        prefix: "listen"
        # Optional colon-separated [token, instance_id] suffix, same
        # shape as register. The relay rejects a listen with empty
        # instance_id — listen always targets a previously-registered
        # backend. The token field is consumed by
        # pigeon.Auth.VerifyRegister (T42) — listen authenticates the
        # same way register does.
        colon_suffix:
          - { name: token,       kind: string }
          - { name: instance_id, kind: string }
