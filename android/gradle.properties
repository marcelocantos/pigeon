kotlin.code.style=official

# AGP / Android library build. UseAndroidX is required by AGP 8.x.
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP wants the Java toolchain to live in the daemon; the build script
# also reads java.home for JNI header includes (desktop build). JDK 17+
# is the project floor; 21 is the supported test runtime (CLAUDE.md
# uses JAVA_HOME=<jdk21>).

# Keep the Gradle daemon JVM heap modest. The native-build steps are
# external Exec calls, not JVM work.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
